<!doctype html>
<html lang="ko" data-theme="midnight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17181c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="오프뮤직">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>오프뮤직</title>
<style>
/* ===== 테마 (기기 색 + 액정 색) ===== */
[data-theme=midnight]{--shell:#17181c;--shell2:#2a2c33;--shellhi:#3b3e47;--keyfg:#c9cbd3;--bezel:#050607;--scr:#08141a;--scr2:#0e2129;--fg:#c6f4ff;--mute:#5e93a3;--hl:linear-gradient(180deg,#4cc3e6,#1e88b0);--hlfg:#03141a;--line:#14303a;--glow:0 0 8px rgba(110,230,255,.35);--segoff:#12303a}
[data-theme=ice]{--shell:#e3e5e9;--shell2:#c2c6cd;--shellhi:#f8f9fb;--keyfg:#3b3f47;--bezel:#1d2026;--scr:#cfe2e9;--scr2:#bad2db;--fg:#0c2a35;--mute:#4f7381;--hl:linear-gradient(180deg,#5aa6f0,#2668c8);--hlfg:#fff;--line:#a9c3cd;--glow:none;--segoff:#a9c3cd}
[data-theme=amber]{--shell:#1a1714;--shell2:#2e2924;--shellhi:#433b31;--keyfg:#dccdb8;--bezel:#060504;--scr:#120b03;--scr2:#1f1407;--fg:#ffbf5e;--mute:#a87436;--hl:linear-gradient(180deg,#ffc56e,#e08c1d);--hlfg:#1c0f00;--line:#33220c;--glow:0 0 8px rgba(255,170,60,.35);--segoff:#3a2610}
[data-theme=lime]{--shell:#2d3330;--shell2:#444c47;--shellhi:#5a645d;--keyfg:#d3dbd5;--bezel:#0b0d0c;--scr:#a7bf86;--scr2:#97b075;--fg:#1b2810;--mute:#4b6334;--hl:#1b2810;--hlfg:#a7bf86;--line:#8ea86f;--glow:none;--segoff:#8ea86f}
[data-theme=pink]{--shell:#f2d3de;--shell2:#dcafc0;--shellhi:#fff2f7;--keyfg:#6b3a4e;--bezel:#2a1720;--scr:#1c0f17;--scr2:#2a1520;--fg:#ffc6de;--mute:#b46f8e;--hl:linear-gradient(180deg,#ff8fbf,#e0558f);--hlfg:#2a0716;--line:#3d1f2d;--glow:0 0 8px rgba(255,140,190,.35);--segoff:#3d1f2d}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{background:radial-gradient(120% 70% at 50% 0%,var(--shellhi),var(--shell) 55%,var(--shell2));color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;overflow:hidden}
svg{width:22px;height:22px;fill:currentColor;flex:none}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.topsafe{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:var(--bezel);z-index:60}
.hidden{display:none!important}

/* ===== 기기 + 액정 ===== */
#device{display:flex;flex-direction:column;height:100vh;height:100dvh;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 10px)}
.screen{position:relative;display:flex;flex-direction:column;min-height:0;background:var(--scr);color:var(--fg);border-radius:12px;overflow:hidden;
  box-shadow:0 0 0 5px var(--bezel),0 0 0 6px rgba(255,255,255,.08),inset 0 2px 12px rgba(0,0,0,.45);text-shadow:var(--glow)}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:linear-gradient(160deg,rgba(255,255,255,.07),transparent 40%),repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 1px,transparent 1px 3px)}
#screen{flex:1;margin:5px 5px 0}
.status{display:flex;align-items:center;gap:6px;padding:6px 10px;font-size:11px;border-bottom:1px solid var(--line);min-height:26px}
.status .sp{flex:1}
.eq{display:inline-flex;gap:1.5px;height:9px;align-items:flex-end;vertical-align:middle}
.eq i{width:2px;height:2px;background:currentColor}
body.playing .eq i{animation:eq .8s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:-.3s!important}.eq i:nth-child(3){animation-delay:-.55s!important}
@keyframes eq{0%{height:2px}100%{height:9px}}
.navbar{display:flex;align-items:center;gap:4px;padding:4px 6px;border-bottom:1px solid var(--line);min-height:44px}
.navbar h1{flex:1;margin:0;font-size:15px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbar .nb{width:64px;display:flex}
.navbar .nb:last-child{justify-content:flex-end}
.icon{background:none;border:0;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none;padding:0}
.icon:active{background:var(--hl);color:var(--hlfg)}
.addbtn{border:1px solid var(--line);background:var(--scr2);border-radius:8px;padding:5px 8px;font-size:12px;display:flex;align-items:center;gap:2px;font-weight:600}
.addbtn svg{width:16px;height:16px}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* 메뉴/목록 */
.mrow,.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;min-height:50px}
.mrow:active,.row:active,.item:active,.npcard:active{background:var(--hl);color:var(--hlfg);text-shadow:none}
.mrow:active .s,.row:active .s,.mrow:active .mr,.row:active .t{color:inherit}
.mrow .ml{flex:1;font-size:16px}
.mrow .ml small{display:block;font-size:11.5px;color:var(--mute);margin-top:2px}
.mrow .mr{color:var(--mute);font-size:13px}
.chev{font-size:20px;line-height:1;opacity:.7;margin-left:2px}
.sec{font-size:11px;letter-spacing:1px;color:var(--mute);padding:14px 12px 6px;border-bottom:1px solid var(--line)}
.meta{flex:1;min-width:0}
.t{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{font-size:12px;color:var(--mute);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{padding:6px 4px 6px 10px}
.row.cur .t{font-weight:800}
.row .eq{margin-right:4px}
.npcard{display:flex;align-items:center;gap:12px;margin:10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--scr2);cursor:pointer}
.cv{flex:none;overflow:hidden;display:grid;place-items:center;font-weight:700;color:#fff;background:var(--scr2);text-shadow:none;border:1px solid var(--line)}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.cv.xs{width:34px;height:34px;font-size:14px;border-radius:4px}
.cv.sm{width:44px;height:44px;font-size:17px;border-radius:5px}
.cv.round{border-radius:50%}
.cv.lg{width:150px;height:150px;font-size:56px;border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.search{padding:10px 10px 0}
.in{width:100%;background:var(--scr2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--fg);font-size:16px;outline:none;font-family:inherit}
textarea.in{resize:vertical;line-height:1.5}
.bar{display:flex;gap:8px;align-items:center;padding:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar select{margin-left:auto;background:var(--scr2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px;font-size:13px}
.btn{background:var(--hl);color:var(--hlfg);border:0;border-radius:8px;padding:8px 13px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:5px;text-shadow:none}
.btn svg{width:17px;height:17px}
.btn.ghost{background:var(--scr2);color:var(--fg);border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px 10px;padding:12px}
.card{cursor:pointer}
.card .cv{width:100%;height:auto;aspect-ratio:1;font-size:44px;border-radius:6px}
.card .t{margin-top:6px;font-size:13.5px}
.card:active{opacity:.6}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:16px 12px 10px}
.hero h2{margin:8px 0 0;font-size:19px}
.empty{text-align:center;padding:40px 20px 24px;color:var(--mute);line-height:1.6}
.empty b{color:var(--fg)}
.foot{font-size:12px;color:var(--mute);text-align:center;padding:14px}
.sw{width:26px;height:26px;border-radius:50%;flex:none;border:2px solid var(--line)}
.sw-midnight{background:linear-gradient(135deg,#2a2c33 50%,#4cc3e6 50%)}
.sw-ice{background:linear-gradient(135deg,#e3e5e9 50%,#5aa6f0 50%)}
.sw-amber{background:linear-gradient(135deg,#2e2924 50%,#ffbf5e 50%)}
.sw-lime{background:linear-gradient(135deg,#444c47 50%,#a7bf86 50%)}
.sw-pink{background:linear-gradient(135deg,#f2d3de 50%,#ff8fbf 50%)}

/* 액정 하단 '지금 재생' 줄 */
#now{display:flex;align-items:center;gap:10px;padding:7px 6px 9px 10px;border-top:1px solid var(--line);position:relative;cursor:pointer;background:var(--scr2)}
#now .t{font-size:13.5px}#now .s{font-size:11.5px;margin-top:1px}
.nbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--segoff)}
.nbar i{display:block;height:100%;width:0;background:var(--fg)}

/* 하드웨어 버튼 */
#keys{display:grid;grid-template-columns:1.25fr 1fr 1.2fr 1fr 1.25fr;gap:8px;padding:14px 2px 2px}
.key{height:50px;border:0;border-radius:14px;color:var(--keyfg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  background:linear-gradient(180deg,var(--shellhi),var(--shell2));box-shadow:0 3px 0 rgba(0,0,0,.35),0 4px 10px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.2)}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.15)}
.key small{font-size:9px;font-weight:700;letter-spacing:1px;opacity:.75}
.key.main svg{width:26px;height:26px}

/* ===== 전체 플레이어 ===== */
#player{position:fixed;inset:0;z-index:20;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 14px);
  background:radial-gradient(120% 70% at 50% 0%,var(--shellhi),var(--shell) 55%,var(--shell2))}
#player.open{transform:none}
.pscreen{flex:1 1 auto;margin:5px}
.pbody{flex:1;min-height:0;display:grid;place-items:center;padding:12px 12px 4px;position:relative}
.pbody .cv.big{width:min(64vw,30vh,330px);height:min(64vw,30vh,330px);font-size:80px;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.pbody.lyr{display:block;padding:0}
.ly::-webkit-scrollbar{display:none}
.ly{scrollbar-width:none;height:100%;overflow-y:auto;position:relative;padding:30% 16px;text-align:center;-webkit-user-select:text;user-select:text}
.ly p{margin:0;padding:6px 0;font-size:15px;line-height:1.45;color:var(--mute);transition:color .2s;cursor:pointer}
.ly p.on{color:var(--fg);font-weight:800;font-size:16.5px}
.ly.plain{padding:16px;font-size:15px;line-height:1.7;color:var(--fg);text-align:center}
.lyedit{display:block;margin:18px auto 0;background:none;border:1px solid var(--line);color:var(--mute);border-radius:8px;padding:6px 12px;font-size:12px}
.nolyr{text-align:center;color:var(--mute)}
#scrubTip{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--hl);color:var(--hlfg);text-shadow:none;padding:4px 10px;border-radius:6px;font-size:13px;font-weight:700}
.pmeta{padding:6px 14px 0;text-align:center;cursor:pointer}
.mq{overflow:hidden;white-space:nowrap}
.mq>span{display:inline-block}
.mq.run>span{animation:mq var(--dur,10s) linear infinite}
.mq .gap{display:inline-block;width:48px}
@keyframes mq{0%,15%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.pt{font-size:18px;font-weight:800}
.pa{font-size:13px;color:var(--mute);margin-top:3px}
.pbarwrap{padding:10px 14px 0}
.seg{position:relative;height:10px;background:var(--segoff);cursor:pointer;touch-action:none}
.seg i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--fg);box-shadow:var(--glow)}
.seg::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 5px,var(--scr) 5px 7px)}
.seg::before{content:"";position:absolute;inset:-12px 0}
.times{display:flex;justify-content:space-between;font-size:11.5px;margin-top:5px;color:var(--mute)}
.soft{display:flex;justify-content:space-between;padding:8px 6px 8px;border-top:1px solid var(--line);margin-top:10px}
.soft button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9.5px;color:var(--mute);width:44px;padding:4px 0;border-radius:8px;position:relative}
.soft button.on{color:var(--fg)}
.soft button.on::after{content:"";position:absolute;bottom:-3px;width:4px;height:4px;border-radius:50%;background:var(--fg)}
.soft button:active{background:var(--hl);color:var(--hlfg)}
.soft svg{width:21px;height:21px}
.badge1{position:absolute;top:2px;right:9px;font-size:8px;font-weight:900}

/* 클릭 휠 */
.wheel{position:relative;flex:none;width:min(62vw,31vh,250px);aspect-ratio:1;margin:16px auto 0;border-radius:50%;touch-action:none;color:var(--keyfg);
  background:radial-gradient(circle at 50% 30%,var(--shellhi),var(--shell2) 70%);box-shadow:0 6px 18px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.2),inset 0 -3px 6px rgba(0,0,0,.2)}
.wheel.press{filter:brightness(.96)}
.wl{position:absolute;font-size:12px;font-weight:800;letter-spacing:1.5px;pointer-events:none;display:grid;place-items:center}
.wl svg{width:20px;height:20px}
.wl.top{top:9%;left:50%;transform:translateX(-50%)}
.wl.bottom{bottom:8%;left:50%;transform:translateX(-50%)}
.wl.left{left:8%;top:50%;transform:translateY(-50%)}
.wl.right{right:8%;top:50%;transform:translateY(-50%)}
.hub{position:absolute;left:31%;top:31%;width:38%;height:38%;border-radius:50%;pointer-events:none;display:grid;place-items:center;font-size:11px;font-weight:800;letter-spacing:1px;
  background:radial-gradient(circle at 50% 35%,var(--shellhi),var(--shell));box-shadow:0 2px 6px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.25)}
.wheel.hubdown .hub{transform:scale(.96);filter:brightness(.92)}

/* ===== 시트 ===== */
#sheetWrap{position:fixed;inset:0;z-index:30;pointer-events:none}
#sheetWrap .scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .2s}
#sheet{position:absolute;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 8px);background:var(--scr);color:var(--fg);border-radius:14px;
  box-shadow:0 0 0 4px var(--bezel);padding:12px 12px 10px;transform:translateY(120%);transition:transform .25s ease;max-height:78vh;overflow-y:auto;text-shadow:var(--glow)}
#sheetWrap.open{pointer-events:auto}
#sheetWrap.open .scrim{opacity:1}
#sheetWrap.open #sheet{transform:none}
#sheet h3{margin:2px 0 10px;font-size:15px}
.shead{display:flex;gap:12px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line)}
.item{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;padding:12px 6px;font-size:15px}
.item:last-child{border-bottom:0}
.item.danger{color:#ff7b7b}
.item .mr{margin-left:auto;color:var(--mute);font-size:13px}
.row2{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:12px}
label.f{display:block;font-size:12px;color:var(--mute);margin:10px 0 5px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%) translateY(16px);background:var(--fg);color:var(--scr);padding:9px 15px;border-radius:8px;font-size:13.5px;font-weight:600;opacity:0;transition:.2s;z-index:50;pointer-events:none;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.fileIn{display:none}
/* ===== 기기 연결 ===== */
.lk p{white-space:normal;line-height:1.55;font-size:13.5px;color:var(--mute);margin:4px 0 10px}
.lk .code{font-size:42px;font-weight:800;letter-spacing:10px;text-align:center;margin:14px 0 6px;padding-left:10px}
.lk .big{font-size:15px;color:var(--fg);text-align:center;margin:8px 0}
.lk .drop{display:block;width:100%;border:2px dashed var(--line);border-radius:12px;padding:22px 10px;text-align:center;background:var(--scr2);color:var(--fg);font-size:14px;margin:8px 0}
.lk .drop:active{background:var(--hl);color:var(--hlfg)}
.lk .prog{height:8px;background:var(--segoff);border-radius:4px;overflow:hidden;margin:6px 0}
.lk .prog i{display:block;height:100%;background:var(--fg)}
.lk .codein{font-size:28px;text-align:center;letter-spacing:8px;font-weight:800}
.lk .ok{color:var(--fg);font-weight:700}
#drop{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.65);display:grid;place-items:center;color:#fff;font-size:20px;font-weight:700;pointer-events:none;text-align:center;line-height:1.6}
#drop>div{border:3px dashed #fff;border-radius:20px;padding:40px 50px}
/* 컴퓨터 화면에서는 가운데에 폰 크기로 */
@media (min-width:700px){
  #device{max-width:460px;margin:0 auto}
  #player{max-width:460px;margin:0 auto;left:0;right:0}
  #sheet{max-width:444px;margin:0 auto}
}
</style>
</head>
<body>
<div class="topsafe"></div>
<div id="device">
  <div id="screen" class="screen">
    <div class="status mono"><span id="sPlay">❚❚</span><span class="eq"><i></i><i></i><i></i></span><span class="sp"></span><span data-linkbadge></span><span data-sleepbadge></span><span class="clock"></span></div>
    <div class="navbar">
      <div class="nb"><button class="icon" id="backBtn" data-act="back" data-icon="back"></button></div>
      <h1 id="title">오프뮤직</h1>
      <div class="nb"><button class="addbtn" data-act="import"><span data-icon="plus"></span>추가</button></div>
    </div>
    <main id="main"></main>
    <div id="now" class="hidden" data-act="openplayer">
      <div id="nCover"></div>
      <div class="meta"><div class="t" id="nT"></div><div class="s" id="nA"></div></div>
      <button class="icon" id="nPlay" data-act="toggle"></button>
      <div class="nbar"><i id="nfill"></i></div>
    </div>
  </div>
  <div id="keys">
    <button class="key" data-act="menu"><small>MENU</small></button>
    <button class="key" data-act="prev"><span data-icon="prev"></span></button>
    <button class="key main" data-act="toggle" id="kPlay"></button>
    <button class="key" data-act="next"><span data-icon="next"></span></button>
    <button class="key" data-act="openplayer"><small>NOW</small></button>
  </div>
</div>

<section id="player" aria-label="플레이어">
  <div class="screen pscreen">
    <div class="status mono"><span id="pPlay">❚❚</span><span class="eq"><i></i><i></i><i></i></span><span id="pIdx"></span><span class="sp"></span><span id="pMode"></span><span data-sleepbadge></span><span class="clock"></span></div>
    <div class="pbody" id="pbody"></div>
    <div class="pmeta" data-act="morecur"><div class="mq pt" id="pT"></div><div class="mq pa" id="pA"></div></div>
    <div class="pbarwrap">
      <div class="seg" id="pseg"><i id="pfill"></i></div>
      <div class="times mono"><span id="tCur">0:00</span><span id="tRem">-0:00</span></div>
    </div>
    <div class="soft">
      <button id="kShuf" data-act="shuf"><span data-icon="shuffle"></span>셔플</button>
      <button id="kRep" data-act="rep"><span data-icon="repeat"></span>반복</button>
      <button id="kLike" data-act="likecur"><span id="kLikeIco"></span>좋아요</button>
      <button id="kLyr" data-act="lyrtoggle"><span data-icon="lyrics"></span>가사</button>
      <button id="kSleep" data-act="sleep"><span data-icon="moon"></span>타이머</button>
      <button data-act="queue"><span data-icon="queue"></span>목록</button>
      <button data-act="addcur"><span data-icon="addlist"></span>담기</button>
    </div>
    <div id="scrubTip" class="mono hidden"></div>
  </div>
  <div class="wheel" id="wheel">
    <span class="wl top">MENU</span>
    <span class="wl left" data-icon="prev"></span>

/* ================= 저장소 (IndexedDB · 기기 안에만) ================= */
let db;

  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('tracks',{keyPath:'id'});d.createObjectStore('files',{keyPath:'id'});d.createObjectStore('playlists',{keyPath:'id'})};

/* ================= 태그 읽기 (ID3v1/v2, FLAC) ================= */
const mkTD=(e,o)=>{try{return new TextDecoder(e,o)}catch(_){return null}};
const LATIN=mkTD('latin1'),UTF8=mkTD('utf-8'),UTF8F=mkTD('utf-8',{fatal:true}),EUCKR=mkTD('euc-kr'),U16LE=mkTD('utf-16le'),U16BE=mkTD('utf-16be');
function decodeLegacy(b){let hi=false;for(let i=0;i<b.length;i++)if(b[i]>=0x80){hi=true;break}
  if(!hi)return LATIN.decode(b);try{return UTF8F.decode(b)}catch(_){}return (EUCKR||LATIN).decode(b)}
function decodeText(enc,b,keepNul){let s;
  if(enc===0)s=decodeLegacy(b);
  else if(enc===1){if(b[0]===0xFE&&b[1]===0xFF)s=U16BE.decode(b.subarray(2));else if(b[0]===0xFF&&b[1]===0xFE)s=U16LE.decode(b.subarray(2));else s=U16LE.decode(b)}
  else if(enc===2)s=U16BE.decode(b);else s=UTF8.decode(b);
  s=s.replace(/^﻿/,'').replace(/\0+$/,'');
  return (keepNul?s.replace(/\0/g,''):s.replace(/\0/g,' / ')).trim()}
function decodeFileText(buf){const b=new Uint8Array(buf);
  if(b[0]===0xFF&&b[1]===0xFE)return U16LE.decode(b.subarray(2));if(b[0]===0xFE&&b[1]===0xFF)return U16BE.decode(b.subarray(2));
  try{return UTF8F.decode(b).replace(/^﻿/,'')}catch(_){return (EUCKR||LATIN).decode(b)}}
function unsync(b){const o=[];for(let i=0;i<b.length;i++){o.push(b[i]);if(b[i]===0xFF&&b[i+1]===0x00)i++}return new Uint8Array(o)}
const synch=(b,p)=>((b[p]&0x7f)<<21)|((b[p+1]&0x7f)<<14)|((b[p+2]&0x7f)<<7)|(b[p+3]&0x7f);
function skipStr(d,p,enc){if(enc===1||enc===2){while(p+1<d.length&&!(d[p]===0&&d[p+1]===0))p+=2;return p+2}while(p<d.length&&d[p]!==0)p++;return p+1}
function parsePic(d,ver){let p=1,mime;const enc=d[0];
  if(ver===2){mime=LATIN.decode(d.subarray(1,4)).toLowerCase()==='png'?'image/png':'image/jpeg';p=4}
  else{let e=p;while(e<d.length&&d[e]!==0)e++;mime=LATIN.decode(d.subarray(p,e)).toLowerCase()||'image/jpeg';p=e+1;if(!mime.includes('/'))mime='image/'+mime.replace('jpg','jpeg')}
  p=skipStr(d,p+1,enc);
  return new Blob([d.slice(p)],{type:mime})}
function parseUSLT(d){const enc=d[0];const p=skipStr(d,4,enc);return decodeText(enc,d.subarray(p),true)}
function parseID3v2(b,ver,flags,out){
  if((flags&0x80)&&ver<4)b=unsync(b);
  let p=0;
  if(flags&0x40){p=ver===3?4+((b[0]<<24)|(b[1]<<16)|(b[2]<<8)|b[3]):synch(b,0)}
  const idLen=ver===2?3:4,hLen=ver===2?6:10;
  const map=ver===2?{TT2:'title',TP1:'artist',TAL:'album',TP2:'albumArtist',PIC:'pic',ULT:'lyrics'}:{TIT2:'title',TPE1:'artist',TALB:'album',TPE2:'albumArtist',APIC:'pic',USLT:'lyrics'};
  while(p+hLen<=b.length){
    const id=LATIN.decode(b.subarray(p,p+idLen));
    if(!/^[A-Z0-9]+$/.test(id))break;
    const size=ver===2?(b[p+3]<<16)|(b[p+4]<<8)|b[p+5]:ver===4?synch(b,p+4):((b[p+4]<<24)>>>0)+(b[p+5]<<16)+(b[p+6]<<8)+b[p+7];
    const ff=ver===4?b[p+9]:0;
    let d=b.subarray(p+hLen,p+hLen+size);p+=hLen+size;
    const key=map[id];if(!key||!size)continue;
    if(ff&0x02)d=unsync(d);if(ff&0x01)d=d.subarray(4);
    try{if(out[key])continue;
      if(key==='pic')out.pic=parsePic(d,ver);else if(key==='lyrics')out.lyrics=parseUSLT(d);else out[key]=decodeText(d[0],d.subarray(1))}catch(e){}
  }}
async function parseFlac(file,out){let p=4;
  for(let n=0;n<64;n++){const h=new Uint8Array(await file.slice(p,p+4).arrayBuffer());if(h.length<4)break;
    const last=h[0]&0x80,type=h[0]&0x7f,len=(h[1]<<16)|(h[2]<<8)|h[3];
    if(type===4||(type===6&&!out.pic)){const d=new Uint8Array(await file.slice(p+4,p+4+len).arrayBuffer());const v=new DataView(d.buffer);
      if(type===4){let q=4+v.getUint32(0,true);const cnt=v.getUint32(q,true);q+=4;
        for(let k=0;k<cnt&&q<d.length;k++){const l=v.getUint32(q,true);q+=4;const s=UTF8.decode(d.subarray(q,q+l));q+=l;
          const eq=s.indexOf('=');const key=s.slice(0,eq).toUpperCase(),val=s.slice(eq+1);
          const m={TITLE:'title',ARTIST:'artist',ALBUM:'album',ALBUMARTIST:'albumArtist',LYRICS:'lyrics',UNSYNCEDLYRICS:'lyrics'}[key];if(m&&!out[m])out[m]=val}}
      else{let q=4;const ml=v.getUint32(q);q+=4;const mime=LATIN.decode(d.subarray(q,q+ml));q+=ml;const dl=v.getUint32(q);q+=4+dl+16;const pl=v.getUint32(q);q+=4;out.pic=new Blob([d.slice(q,q+pl)],{type:mime||'image/jpeg'})}}
    p+=4+len;if(last)break}}
async function readTags(file){const out={};
  try{const h=new Uint8Array(await file.slice(0,10).arrayBuffer());
    if(h[0]===0x49&&h[1]===0x44&&h[2]===0x33){const size=synch(h,6);parseID3v2(new Uint8Array(await file.slice(10,10+size).arrayBuffer()),h[3],h[5],out)}
    else if(h[0]===0x66&&h[1]===0x4C&&h[2]===0x61&&h[3]===0x43)await parseFlac(file,out);
    if((!out.title||!out.artist)&&file.size>128){const t=new Uint8Array(await file.slice(file.size-128).arrayBuffer());
      if(t[0]===0x54&&t[1]===0x41&&t[2]===0x47){const g=(a,b)=>{let e=a;while(e<b&&t[e])e++;return decodeLegacy(t.subarray(a,e)).trim()};
        out.title=out.title||g(3,33);out.artist=out.artist||g(33,63);out.album=out.album||g(63,93)}}
  }catch(e){console.warn('tag',e)}
  return out}
function fromName(n){const b=n.replace(/\.[^.]+$/,'').replace(/^\s*\d{1,3}\s*[._-]\s*/,'').replace(/_/g,' ').trim();
  const m=b.split(/\s+-\s+/);return m.length>=2?{artist:m[0].trim(),title:m.slice(1).join(' - ').trim()}:{title:b,artist:''}}

const EXT={mp3:'audio/mpeg',m4a:'audio/mp4',aac:'audio/aac',flac:'audio/flac',wav:'audio/wav',ogg:'audio/ogg',opus:'audio/ogg'};
function getDuration(blob){return new Promise(res=>{const a=new Audio(),u=URL.createObjectURL(blob);let done=false;
  const fin=d=>{if(done)return;done=true;URL.revokeObjectURL(u);a.removeAttribute('src');res(isFinite(d)?d:0)};
  a.preload='metadata';a.onloadedmetadata=()=>fin(a.duration);a.onerror=()=>fin(0);setTimeout(()=>fin(0),8000);a.src=u})}

/* ================= 가사 (LRC) ================= */
function parseLRC(txt){const out=[];let off=0;
  for(let raw of String(txt).split(/\r?\n/)){raw=raw.trim();
    const o=raw.match(/^\[offset:\s*([+-]?\d+)\s*\]$/i);if(o){off=+o[1]/1000;continue}
    const re=/\[(\d{1,3}):(\d{1,2})(?:[.:](\d{1,3}))?\]/g;let m,last=0;const times=[];
    while((m=re.exec(raw))){if(m.index!==last)break;times.push(+m[1]*60+ +m[2]+(m[3]?+('0.'+m[3]):0));last=re.lastIndex}
    if(times.length){const text=raw.slice(last).trim();for(const t of times)out.push({t,text})}}
  out.sort((a,b)=>a.t-b.t);out.forEach(l=>l.t=Math.max(0,l.t-off));
  return out.length>=2?out:null}
const plainLyrics=txt=>String(txt).split(/\r?\n/).filter(l=>!/^\s*\[[a-z]+:.*\]\s*$/i.test(l)).join('\n').trim();

/* ================= 상태 ================= */
const S={tracks:[],map:new Map(),pls:[],stack:[{v:'home'}],q:'',sort:lsGet('om_sort','recent'),visible:[],ctx:{},pendingNav:null,
  showLyrics:lsGet('om_lyr',false),coverIds:[]};
const coverUrls=new Map();
function coverURL(t){if(!t||!t.cover)return null;let u=coverUrls.get(t.id);if(!u){u=URL.createObjectURL(t.cover);coverUrls.set(t.id,u)}return u}
function dropCoverURL(id){const u=coverUrls.get(id);if(u){URL.revokeObjectURL(u);coverUrls.delete(id)}}
function cv(t,size,label){const u=coverURL(t);
  if(u)return `<div class="cv ${size}"><img src="${u}" alt="" loading="lazy"></div>`;
  const k=label??(t?(t.album&&t.album!==UNK_AL?t.album:t.title):'♪');const h=hue(k);
  return `<div class="cv ${size}" style="background:linear-gradient(135deg,hsl(${h} 50% 42%),hsl(${(h+50)%360} 55% 22%))"><span>${esc((k||'♪').trim().charAt(0).toUpperCase())}</span></div>`}
const cur=()=>S.map.get(P.queue[P.i]);

/* ================= 테마 ================= */
function applyTheme(th){document.documentElement.dataset.theme=th;lsSet('om_theme',th);
  const c=getComputedStyle(document.documentElement).getPropertyValue('--shell').trim();const m=$('meta[name=theme-color]');if(m&&c)m.content=c}
applyTheme(lsGet('om_theme','midnight'));

/* ================= 음악 가져오기 ================= */
$('#file').addEventListener('change',e=>{const f=e.target.files;if(f&&f.length)importFiles(f);e.target.value=''});
const isAudioF=f=>/\.(mp3|m4a|aac|flac|wav|ogg|opus)$/i.test(f.name)||(/^audio\//.test(f.type)&&!/\.(lrc|txt)$/i.test(f.name));
const isLyrF=f=>/\.(lrc|txt)$/i.test(f.name);
async function importFiles(list,opts={}){
  list=[...list];const quiet=!!opts.quiet;
  const audioF=list.filter(isAudioF);
  const lyrF=new Map(list.filter(isLyrF).map(f=>[baseName(f.name),f]));
  if(!audioF.length&&!lyrF.size){if(!quiet)toast('오디오 파일이 없어요');return {added:0,skip:0,fail:0,lyrN:0}}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(_){}
  const seen=new Set(S.tracks.map(t=>t.srcName+'|'+t.size));let added=0,skip=0,fail=0,lyrN=0,quota=false;
  const readLyr=async f=>decodeFileText(await f.arrayBuffer()).trim();
  for(let i=0;i<audioF.length;i++){const f=audioF[i];if(!quiet)toast(`가져오는 중… ${i+1}/${audioF.length}`,0);
    if(seen.has(f.name+'|'+f.size)){skip++;continue}
    try{const tag=await readTags(f),fb=fromName(f.name);
      const ext=(f.name.split('.').pop()||'').toLowerCase();
      const blob=new Blob([f],{type:f.type||EXT[ext]||'audio/mpeg'});
      const dur=await getDuration(blob);
      let lyrics=clean(tag.lyrics);const lf=lyrF.get(baseName(f.name));
      if(lf){const l=await readLyr(lf);if(l){lyrics=l;lyrN++}lyrF.delete(baseName(f.name))}else if(lyrics)lyrN++;
      const t={id:uid(),title:clean(tag.title)||fb.title||f.name,artist:clean(tag.artist)||clean(tag.albumArtist)||fb.artist||UNK_AR,
        album:clean(tag.album)||UNK_AL,duration:dur,cover:tag.pic&&tag.pic.size>200?tag.pic:null,lyrics,
        srcName:f.name,size:f.size,addedAt:Date.now()+i,plays:0,lastPlayed:0,liked:false,likedAt:0};
      await dbPut('files',{id:t.id,blob});await dbPut('tracks',t);
      S.tracks.push(t);S.map.set(t.id,t);seen.add(f.name+'|'+f.size);added++;
    }catch(e){console.error(e);fail++;if(e&&e.name==='QuotaExceededError'){quota=true;break}}}
  // 따로 고른 가사 파일 → 이미 등록된 같은 이름의 곡에 붙이기
  for(const [bn,f] of lyrF){const t=S.tracks.find(x=>baseName(x.srcName||'')===bn);if(!t)continue;
    const l=await readLyr(f);if(l){t.lyrics=l;await dbPut('tracks',t);lyrN++}}
  const parts=[];if(added)parts.push(`${added}곡 추가`);if(skip)parts.push(`중복 ${skip}곡 건너뜀`);if(lyrN)parts.push(`가사 ${lyrN}개`);if(fail)parts.push(`실패 ${fail}곡`);
  if(!quiet||quota)toast(quota?'저장 공간이 부족해요':(parts.join(' · ')||'추가된 것이 없어요'),3500);
  refresh();updateUI();return {added,skip,fail,lyrN,quota}}

const audio=$('#audio');

const shuffled=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

function playList(ids,start=0,shuf){if(!ids.length)return;if(shuf!==undefined)P.shuffle=shuf;P.orig=ids.slice();
  if(P.shuffle){const first=shuf?ids[Math.random()*ids.length|0]:ids[start];const rest=ids.slice();rest.splice(rest.indexOf(first),1);P.queue=[first,...shuffled(rest)];P.i=0}
  else{P.queue=ids.slice();P.i=start}
  load(true)}
async function load(auto,seekTo){const t=cur();if(!t)return;
  const f=await dbGet('files',t.id);if(!f){toast('파일을 찾을 수 없어요');return}
  if(P.url)URL.revokeObjectURL(P.url);P.url=URL.createObjectURL(f.blob);audio.src=P.url;audio.volume=1;
  counted=!!(seekTo&&seekTo>20);
  if(seekTo)audio.addEventListener('loadedmetadata',()=>{audio.currentTime=seekTo},{once:true});
  if(auto)audio.play().catch(()=>{});
  setMeta(t);updateUI();drawProgress();save();refresh()}
function next(auto){if(!P.queue.length)return;
  if(P.i<P.queue.length-1)P.i++;else if(P.repeat==='all'||!auto)P.i=0;else{audio.pause();audio.currentTime=0;updateUI();return}load(true)}
function prev(){if(!P.queue.length)return;if(audio.currentTime>3){audio.currentTime=0;return}P.i=P.i>0?P.i-1:P.queue.length-1;load(true)}
function toggle(){if(!cur()){if(S.tracks.length)playList(sortedSongs().map(t=>t.id),0);return}if(!audio.src){load(true);return}audio.paused?audio.play().catch(()=>{}):audio.pause()}
function toggleShuffle(){P.shuffle=!P.shuffle;if(P.queue.length){const c=P.queue[P.i];
  if(P.shuffle){const rest=P.orig.slice();const k=rest.indexOf(c);if(k>=0)rest.splice(k,1);P.queue=[c,...shuffled(rest)];P.i=0}
  else{P.queue=P.orig.slice();P.i=Math.max(0,P.queue.indexOf(c))}}
  toast(P.shuffle?'셔플 켜짐':'셔플 꺼짐',1100);updateUI();save()}
function cycleRepeat(){P.repeat={off:'all',all:'one',one:'off'}[P.repeat];toast({off:'반복 끔',all:'전체 반복',one:'한 곡 반복'}[P.repeat],1100);updateUI();save()}
function playNext(id){if(!P.queue.length){playList([id],0);return}
  P.queue.splice(P.i+1,0,id);const k=P.orig.indexOf(P.queue[P.i]);P.orig.splice(k+1,0,id);save();updateUI();toast('다음 곡으로 넣었어요')}
async function countPlay(t){t.plays=(t.plays||0)+1;t.lastPlayed=Date.now();try{await dbPut('tracks',t)}catch(_){}}

  if(SL.eot){SL.eot=false;tick();toast('잠자기 타이머: 재생을 멈췄어요',3000);updateUI();return}
  if(P.repeat==='one'){counted=false;audio.currentTime=0;audio.play().catch(()=>{})}else next(true)});

  drawProgress();syncLyrics();

  checkSleep();

  try{if(d&&navigator.mediaSession&&navigator.mediaSession.setPositionState)navigator.mediaSession.setPositionState({duration:d,position:Math.min(c,d),playbackRate:1})}catch(_){}});
function drawProgress(){const d=audio.duration||0,c=preview!=null?preview:(audio.currentTime||0),pct=d?Math.min(100,c/d*100):0;
  $('#pfill').style.width=pct+'%';$('#nfill').style.width=pct+'%';$('#tCur').textContent=fmt(c);$('#tRem').textContent='-'+fmt(d-c)}
// 진행 막대 드래그
(()=>{const seg=$('#pseg');let on=false;
  const at=e=>{const r=seg.getBoundingClientRect();return Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))*(audio.duration||0)};
  seg.addEventListener('pointerdown',e=>{if(!audio.duration)return;on=true;seg.setPointerCapture(e.pointerId);preview=at(e);drawProgress()});
  seg.addEventListener('pointermove',e=>{if(on){preview=at(e);drawProgress()}});
  const end=()=>{if(!on)return;on=false;if(preview!=null)audio.currentTime=preview;preview=null;drawProgress();syncLyrics(true)};
  seg.addEventListener('pointerup',end);seg.addEventListener('pointercancel',end)})();
// 클릭 휠: 돌리면 탐색, 누르면 버튼
(()=>{const w=$('#wheel'),tip=$('#scrubTip');let st=null;
  const geo=(e,r)=>{const dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);return {a:Math.atan2(dy,dx)*180/Math.PI,rad:Math.hypot(dx,dy)/(r.width/2)}};
  w.addEventListener('pointerdown',e=>{const r=w.getBoundingClientRect(),g=geo(e,r);if(g.rad>1.05)return;
    st={r,a0:g.a,a:g.a,rad:g.rad,acc:0,scrub:false,base:audio.currentTime||0};w.setPointerCapture(e.pointerId);w.classList.add(g.rad<0.4?'hubdown':'press')});
  w.addEventListener('pointermove',e=>{if(!st||st.rad<0.4)return;const g=geo(e,st.r);let d=g.a-st.a;if(d>180)d-=360;if(d<-180)d+=360;st.a=g.a;st.acc+=d;
    if(!st.scrub&&Math.abs(st.acc)>14)st.scrub=true;
    if(st.scrub&&audio.duration){preview=Math.min(audio.duration-0.3,Math.max(0,st.base+st.acc/360*60));drawProgress();
      tip.textContent=(st.acc>0?'▶▶ ':'◀◀ ')+fmt(preview);tip.classList.remove('hidden')}});
  const end=e=>{if(!st)return;w.classList.remove('press','hubdown');const s=st;st=null;
    if(s.scrub){if(preview!=null)audio.currentTime=preview;preview=null;tip.classList.add('hidden');drawProgress();syncLyrics(true);return}

const SL={until:0,eot:false};
function setSleep(m){SL.eot=m==='eot';SL.until=typeof m==='number'&&m>0?Date.now()+m*60000:0;audio.volume=1;
  toast(SL.eot?'이 곡이 끝나면 멈춰요':SL.until?`${m}분 뒤에 멈춰요`:'잠자기 타이머 꺼짐',1600);tick();updateUI()}
function checkSleep(){if(!SL.until)return;const left=(SL.until-Date.now())/1000;
  if(left<=0){SL.until=0;audio.pause();audio.volume=1;toast('잠자기 타이머: 재생을 멈췄어요',3000);tick();updateUI()}
  else if(left<10&&!audio.paused){try{audio.volume=Math.max(.05,left/10)}catch(_){}}}
function sleepSheet(){const on=SL.until||SL.eot;
  openSheet(`<h3>${I.moon.replace('<svg','<svg style="width:16px;height:16px;vertical-align:-3px"')} 잠자기 타이머 <span class="mono" style="font-weight:400;color:var(--mute)">· ${sleepLabel()}</span></h3>`+
    [10,15,30,45,60,90].map(m=>`<button class="item" data-act="setsleep" data-m="${m}">${m}분 뒤</button>`).join('')+
    `<button class="item" data-act="setsleep" data-m="eot">지금 곡이 끝나면</button>`+(on?`<button class="item danger" data-act="setsleep" data-m="0">타이머 끄기</button>`:''))}
function tick(){const d=new Date();const c=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  document.querySelectorAll('.clock').forEach(e=>e.textContent=c);
  const badge=SL.eot?'☾곡':SL.until?'☾'+Math.max(1,Math.ceil((SL.until-Date.now())/60000)):'';
  document.querySelectorAll('[data-sleepbadge]').forEach(e=>e.textContent=badge);

    const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');
    c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',.88))}finally{URL.revokeObjectURL(url)}}

/* ================= 기기 연결 (컴퓨터 ↔ 폰) =================
   연결할 때만 인터넷으로 서로를 찾고(PeerJS), 노래는 WebRTC로 기기끼리 직접 전송해요. */
const PFX='offmusic-v1-',CH=16*1024,PEERJS='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';

  rx:null,rxDone:0,rxAdded:0,rxName:'',rxPct:0,

  if(/Android/.test(u))return '안드로이드';if(/Windows/.test(u))return 'Windows 컴퓨터';if(/Mac/.test(u))return 'Mac';return '다른 기기'}
function linkLabel(){if(LINK.state==='connected')return '연결됨';if(LINK.state==='waiting')return '기다리는 중';if(LINK.state==='connecting'||LINK.state==='starting')return '연결 중';return ''}
function loadPeer(){if(window.Peer)return Promise.resolve();return new Promise((res,rej)=>{const s=document.createElement('script');s.src=PEERJS;s.onload=res;s.onerror=()=>{s.remove();rej(new Error('load'))};document.head.appendChild(s)})}
async function wake(on){try{if(on&&!LINK.wake&&navigator.wakeLock){LINK.wake=await navigator.wakeLock.request('screen');LINK.wake.addEventListener('release',()=>{LINK.wake=null})}
  else if(!on&&LINK.wake){await LINK.wake.release();LINK.wake=null}}catch(_){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&LINK.state==='connected')wake(true)});
function peerErr(e){const t=e&&e.type;
  if(t==='peer-unavailable')return '그 번호의 기기를 찾을 수 없어요. 폰 화면의 번호를 다시 확인해 주세요.';
  if(t==='network'||t==='server-error'||t==='socket-error'||t==='socket-closed')return '인터넷에 연결되어 있어야 기기를 찾을 수 있어요. 와이파이를 확인해 주세요.';

  Object.assign(LINK,{role:null,state:'idle',code:'',remote:'',err:'',rx:null,rxDone:0,rxAdded:0,rxName:'',rxPct:0,have:new Set()});
  Object.assign(LINK.tx,{queue:[],busy:false,sent:0,total:0,cur:'',pct:0,skipped:0,added:0,dup:0,fail:0,lyr:0});wake(false);linkUpdate()}

  document.querySelectorAll('[data-linkbadge]').forEach(e=>e.textContent=LINK.state==='connected'?'⇄':'');

function linkHTML(){const L2=LINK,x=L2.tx;

  const doneAll=!x.busy&&x.total&&x.sent>=x.total;

    <button class="drop" data-act="sendpick"><b>노래 파일 고르기</b><br><span style="font-size:12px;color:var(--mute)">또는 mp3·lrc 파일을 이 창에 끌어다 놓기</span></button>
    ${S.tracks.length?`<button class="item" data-act="sendlib">${I.lists}이 기기의 노래 ${S.tracks.length}곡 전부 보내기<span class="mr">가사·커버·좋아요 포함</span></button>`:''}
    ${x.total?`<p class="big">${x.busy?`보내는 중 ${Math.min(x.sent+1,x.total)}/${x.total} · ${esc(x.cur)}`:(doneAll?'다 보냈어요 ✓':'')}</p>
      <div class="prog"><i style="width:${x.total?((x.sent+(x.busy?x.pct/100:0))/x.total*100):0}%"></i></div>
      <p style="text-align:center">새로 추가 <b class="ok">${x.added}</b> · 이미 있음 <b class="ok">${x.dup+x.skipped}</b>${x.lyr?` · 가사 <b class="ok">${x.lyr}</b>`:''}${x.fail?` · 실패 <b class="ok">${x.fail}</b>`:''}</p>`:''}
    <div class="row2"><button class="btn ghost" data-act="linkoff">연결 끊기</button><button class="btn" data-act="back">닫기</button></div>`}
function linkSheet(){openSheet('<div class="lk" id="linkBox"></div>');linkUpdate(true)}

/* --- 받는 쪽 --- */
async function startReceive(){linkReset();LINK.role='recv';LINK.state='starting';linkUpdate(true);
  try{await loadPeer()}catch(_){return linkFail('인터넷에 연결되어 있어야 기기를 찾을 수 있어요. 와이파이를 확인해 주세요.')}
  if(LINK.role!=='recv')return;
  const open=()=>{LINK.code=String(Math.floor(100000+Math.random()*900000));const p=new Peer(PFX+LINK.code);LINK.peer=p;
    p.on('open',()=>{if(LINK.peer!==p)return;LINK.state='waiting';linkUpdate(true)});
    p.on('connection',c=>{if(LINK.conn){c.on('open',()=>c.close());return}LINK.conn=c;
      c.on('open',()=>{LINK.state='connected';wake(true);
        c.send(JSON.stringify({t:'hello',name:devName(),have:S.tracks.map(t=>t.srcName+'|'+t.size)}));linkUpdate(true);toast('연결됐어요')});
      c.on('data',d=>{rxChain=rxChain.then(()=>rxHandle(d,c)).catch(e=>console.error(e))});
      c.on('close',linkClosed);c.on('error',()=>{})});
    p.on('disconnected',()=>{if(LINK.peer===p&&!LINK.conn)try{p.reconnect()}catch(_){}});
    p.on('error',e=>{if(LINK.peer!==p)return;if(e.type==='unavailable-id'){p.destroy();open();return}if(LINK.conn&&e.type!=='peer-unavailable')return;linkFail(peerErr(e))})};
  open()}
let rxChain=Promise.resolve();
async function rxHandle(d,c){
  if(typeof d==='string'){let m;try{m=JSON.parse(d)}catch(_){return}
    if(m.t==='file'){LINK.rx={h:m,parts:[],got:0,total:(m.size||0)+(m.coverSize||0)};LINK.rxName=m.meta?m.meta.title:m.name;LINK.rxPct=0;linkUpdate()}
    else if(m.t==='end'&&LINK.rx){const r=LINK.rx;LINK.rx=null;let st='fail';try{st=await rxStore(r)}catch(e){console.error(e)}
      LINK.rxDone++;if(st==='added')LINK.rxAdded++;try{c.send(JSON.stringify({t:'ack',st}))}catch(_){}linkUpdate()}
    else if(m.t==='done'){toast(`${LINK.remote||'다른 기기'}에서 받기 끝 · 새로 ${LINK.rxAdded}곡`,3000);linkUpdate(true)}
    else if(m.t==='hello'){LINK.remote=m.name||'';linkUpdate(true)}
    return}
  if(d instanceof Blob)d=await d.arrayBuffer();else if(ArrayBuffer.isView(d))d=d.buffer.slice(d.byteOffset,d.byteOffset+d.byteLength);
  const r=LINK.rx;if(!r)return;r.parts.push(d);r.got+=d.byteLength;LINK.rxPct=r.total?Math.min(100,r.got/r.total*100):0;linkUpdate()}
async function rxStore(r){const h=r.h;const all=new Blob(r.parts);r.parts=null;
  let cover=null,audioB=all;if(h.coverSize){cover=all.slice(0,h.coverSize,h.coverType||'image/jpeg');audioB=all.slice(h.coverSize,all.size)}
  if(h.meta){const m=h.meta,key=(m.srcName||h.name)+'|'+(m.size||audioB.size);
    if(S.tracks.some(t=>t.srcName+'|'+t.size===key))return 'dup';
    const blob=new Blob([audioB],{type:h.type||'audio/mpeg'});
    const t={title:m.title||h.name,artist:m.artist||UNK_AR,album:m.album||UNK_AL,duration:m.duration||0,lyrics:m.lyrics||'',
      srcName:m.srcName||h.name,size:m.size||audioB.size,plays:m.plays||0,lastPlayed:m.lastPlayed||0,liked:!!m.liked,likedAt:m.likedAt||0,
      id:uid(),cover:cover&&cover.size>200?cover:null,addedAt:Date.now()};
    await dbPut('files',{id:t.id,blob});await dbPut('tracks',t);S.tracks.push(t);S.map.set(t.id,t);refresh();return 'added'}
  const f=new File([audioB],h.name,{type:h.type||''});const st=await importFiles([f],{quiet:true});
  return st.quota?'fail':st.added?'added':st.lyrN?'lyrics':st.skip?'dup':'fail'}

/* --- 보내는 쪽 --- */
async function startSend(code){if(!/^\d{6}$/.test(code)){toast('6자리 번호를 입력해 주세요');return}
  linkReset();LINK.role='send';LINK.state='connecting';LINK.code=code;linkUpdate(true);
  try{await loadPeer()}catch(_){return linkFail('인터넷에 연결되어 있어야 기기를 찾을 수 있어요. 와이파이를 확인해 주세요.')}
  if(LINK.role!=='send')return;
  const p=new Peer();LINK.peer=p;
  p.on('open',()=>{if(LINK.peer!==p)return;const c=p.connect(PFX+code,{reliable:true,serialization:'raw'});LINK.conn=c;
    const to=setTimeout(()=>{if(LINK.conn===c&&LINK.state==='connecting')linkFail('연결이 안 돼요. 두 기기가 같은 와이파이에 있는지, 번호가 맞는지 확인해 주세요.')},25000);
    c.on('data',async d=>{if(typeof d!=='string')return;let m;try{m=JSON.parse(d)}catch(_){return}
      if(m.t==='hello'){clearTimeout(to);LINK.state='connected';LINK.remote=m.name||'';LINK.have=new Set(m.have||[]);wake(true);
        try{c.send(JSON.stringify({t:'hello',name:devName()}))}catch(_){}toast(`${LINK.remote}와 연결됐어요`);linkUpdate(true);pump()}
      else if(m.t==='ack'){const x=LINK.tx;if(m.st==='added')x.added++;else if(m.st==='dup')x.dup++;else if(m.st==='lyrics')x.lyr++;else x.fail++;linkUpdate()}});
    c.on('close',linkClosed);c.on('error',()=>{})});
  p.on('error',e=>{if(LINK.peer!==p)return;linkFail(peerErr(e))})}
function queueSend(files){if(LINK.role!=='send'||LINK.state!=='connected'){toast('먼저 받을 기기와 연결해 주세요');return}
  const x=LINK.tx,list=[...files].filter(f=>isAudioF(f)||isLyrF(f));
  if(!list.length){toast('보낼 수 있는 노래 파일이 없어요');return}
  list.sort((a,b)=>isLyrF(a)-isLyrF(b)); // 노래 먼저, 가사 파일은 나중에
  for(const f of list){if(isAudioF(f)&&LINK.have.has(f.name+'|'+f.size)){x.skipped++;continue}x.queue.push({file:f});x.total++}
  linkUpdate(true);pump()}
function queueLibrary(){const x=LINK.tx;let n=0;
  for(const t of S.tracks.slice().sort((a,b)=>a.addedAt-b.addedAt)){if(LINK.have.has(t.srcName+'|'+t.size)){x.skipped++;continue}x.queue.push({id:t.id});x.total++;n++}
  if(!n)toast('받는 기기에 이미 다 있어요');linkUpdate(true);pump()}
async function pump(){const x=LINK.tx;if(x.busy||LINK.state!=='connected')return;x.busy=true;linkUpdate(true);
  try{while(x.queue.length&&LINK.state==='connected'){const it=x.queue.shift();await sendItem(it);x.sent++;linkUpdate()}
    if(LINK.conn&&LINK.conn.open)LINK.conn.send(JSON.stringify({t:'done'}))}
  catch(e){console.error(e)}
  x.busy=false;linkUpdate(true)}
async function sendItem(it){const c=LINK.conn,x=LINK.tx;let hdr,blob,cover=null;
  if(it.file){blob=it.file;hdr={t:'file',name:it.file.name,size:blob.size,type:it.file.type}}
  else{const t=S.map.get(it.id);if(!t)return;const f=await dbGet('files',t.id);if(!f)return;blob=f.blob;cover=t.cover||null;
    const meta={};for(const k of ['title','artist','album','duration','lyrics','srcName','size','plays','lastPlayed','liked','likedAt'])meta[k]=t[k];
    hdr={t:'file',name:t.srcName||t.title,size:blob.size,type:blob.type,meta,coverSize:cover?cover.size:0,coverType:cover?cover.type:''}}
  x.cur=hdr.meta?hdr.meta.title:hdr.name;x.pct=0;linkUpdate();
  c.send(JSON.stringify(hdr));
  const parts=cover?[cover,blob]:[blob],total=(cover?cover.size:0)+blob.size;let sent=0;
  const dc=c.dataChannel,BLOCK=512*1024,HIGH=4*1024*1024;
  if(dc)dc.bufferedAmountLowThreshold=1024*1024;
  const drain=()=>new Promise(r=>{let done=false;const fin=()=>{if(done)return;done=true;dc.removeEventListener('bufferedamountlow',fin);r()};
    dc.addEventListener('bufferedamountlow',fin);setTimeout(fin,500)});
  for(const b of parts)for(let o=0;o<b.size;o+=BLOCK){
    const block=new Uint8Array(await b.slice(o,o+BLOCK).arrayBuffer());
    for(let p=0;p<block.length;p+=CH){
      while(dc&&dc.bufferedAmount>HIGH){if(!c.open)throw new Error('closed');await drain()}
      if(!c.open)throw new Error('closed');
      const end=Math.min(p+CH,block.length);c.send(block.slice(p,end).buffer);sent+=end-p}
    x.pct=sent/total*100;linkUpdate()}
  c.send(JSON.stringify({t:'end'}))}
$('#sendFile').addEventListener('change',e=>{const f=e.target.files;if(f&&f.length)queueSend(f);e.target.value=''});

/* --- 컴퓨터: 창에 파일 끌어다 놓기 --- */
let dragN=0;
const hasFiles=e=>e.dataTransfer&&[...(e.dataTransfer.types||[])].includes('Files');
addEventListener('dragenter',e=>{if(!hasFiles(e))return;e.preventDefault();dragN++;
  $('#dropMsg').innerHTML=LINK.role==='send'&&LINK.state==='connected'?`여기에 놓으면<br><b>${esc(LINK.remote||'연결된 기기')}</b>로 보내요`:'여기에 놓으면<br>이 기기에 추가해요';$('#drop').classList.remove('hidden')});
addEventListener('dragover',e=>{if(hasFiles(e))e.preventDefault()});
addEventListener('dragleave',e=>{if(!hasFiles(e))return;if(--dragN<=0){dragN=0;$('#drop').classList.add('hidden')}});
addEventListener('drop',e=>{if(!hasFiles(e))return;e.preventDefault();dragN=0;$('#drop').classList.add('hidden');const f=e.dataTransfer.files;if(!f||!f.length)return;
  if(LINK.role==='send'&&LINK.state==='connected')queueSend(f);else importFiles(f)});

/* ================= 동작 ================= */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;e.stopPropagation();act(el.dataset.act,el)});
async function act(a,el){const d=el.dataset||{};
  switch(a){
  case 'import':$('#file').click();break;
  case 'back':history.back();break;
  case 'menu':if(S.stack.length>1)goHome();else $('#main').scrollTop=0;break;
  case 'go':go(d.key!==undefined?{v:d.v,key:d.key}:{v:d.v});break;
  case 'play':playList(S.visible,+d.i);break;
  case 'playall':playList(S.visible,0,false);break;
  case 'shuffleall':playList(S.visible,0,true);break;
  case 'shufall':if(!S.tracks.length){toast('먼저 음악을 추가해 주세요');break}playList(S.tracks.map(t=>t.id),0,true);openPlayer();break;
  case 'more':moreSheet(d.id,d.i,d.pl);break;
  case 'morecur':{const t=cur();if(t)moreSheet(t.id,-1,'');break}
  case 'openplayer':openPlayer();break;
  case 'toggle':toggle();break;
  case 'next':next(false);break;
  case 'prev':prev();break;
  case 'shuf':toggleShuffle();break;
  case 'rep':cycleRepeat();break;
  case 'likecur':{const t=cur();if(t)toggleLike(t.id);break}
  case 'like':toggleLike(S.ctx.id);history.back();break;
  case 'lyrtoggle':S.showLyrics=!S.showLyrics;lsSet('om_lyr',S.showLyrics);updateUI();break;
  case 'lyseek':if(LY.lines){audio.currentTime=LY.lines[+d.k].t;lyTouch=0;if(audio.paused)audio.play().catch(()=>{});syncLyrics(true)}break;
  case 'lyredit':lyricsEditor(d.id);break;
  case 'lyrmenu':lyricsEditor(S.ctx.id);break;
  case 'lrcfile':$('#lrcFile').click();break;
  case 'lyrsave':{const t=S.map.get(S.ctx.lyrId);if(!t)break;t.lyrics=$('#lyrIn').value.trim();await dbPut('tracks',t);history.back();
    toast(t.lyrics?(parseLRC(t.lyrics)?'싱크 가사 저장됨 · 노래에 맞춰 따라가요':'가사 저장됨'):'가사를 지웠어요');pbodyKey='';updateUI();break}
  case 'sleep':sleepSheet();break;
  case 'setsleep':setSleep(d.m==='eot'?'eot':+d.m);history.back();break;
  case 'queue':openSheet(`<h3>재생 목록 (${P.queue.length}곡)</h3>`+P.queue.map((id,k)=>{const t=S.map.get(id);return t?`<div class="row${k===P.i?' cur':''}" data-act="qjump" data-i="${k}">${cv(t,'sm')}<div class="meta"><div class="t">${k===P.i?'<span class="eq"><i></i><i></i><i></i></span>':''}${esc(t.title)}</div><div class="s">${esc(t.artist)}</div></div></div>`:''}).join(''));
    setTimeout(()=>{const c=$('#sheet .row.cur');c&&c.scrollIntoView({block:'center'})},260);break;
  case 'qjump':P.i=+d.i;load(true);history.back();break;
  case 'addcur':{const t=cur();if(t)addToSheet([t.id]);break}
  case 'playnext':playNext(S.ctx.id);history.back();break;
  case 'addto':addToSheet([S.ctx.id]);break;
  case 'addtopl':history.back();addTo(S.pls.find(p=>p.id===d.pl),S.ctx.ids);break;
  case 'newpladd':{const ids=S.ctx.ids;const n=await ask('새 플레이리스트 이름');if(!n)return;const p=await newPlaylist(n);addTo(p,ids);break}
  case 'newpl':{const n=await ask('새 플레이리스트 이름');if(!n)return;await newPlaylist(n);refresh();toast(`'${n}' 만들었어요`);break}
  case 'goartist':case 'goalbum':{const t=S.map.get(S.ctx.id);if(!t)break;const k=a==='goartist'?'artist':'album';navAfterOverlays({v:k,key:t[k]});break}
  case 'askok':{const v=($('#askIn')||{}).value;const r=askRes;askRes=null;history.back();r&&r((v||'').trim()||null);break}
  case 'cover':coverSheet(S.ctx.id);break;
  case 'pickcover':S.coverIds=d.scope==='album'?S.ctx.coverAlbum:S.ctx.coverOne;$('#imgFile').click();history.back();break;
  case 'rmcover':await setCover(S.ctx.coverOne,null);history.back();toast('커버를 지웠어요');break;
  case 'groupmenu':{const v=view();const ids=S.visible.slice();S.ctx={ids,coverAlbum:ids,coverOne:ids};
    openSheet(`<h3>${esc(v.key)}</h3><button class="item" data-act="addto-all">${I.addlist}전부 플레이리스트에 담기</button>`+
      (d.k==='album'?`<button class="item" data-act="pickcover" data-scope="album">${I.image}앨범 커버 바꾸기</button>`:'')+
      `<button class="item" data-act="likeall">${I.heart}전부 좋아요</button>`);break}
  case 'addto-all':addToSheet(S.ctx.ids);break;
  case 'likeall':{for(const id of S.ctx.ids){const t=S.map.get(id);if(t&&!t.liked){t.liked=true;t.likedAt=Date.now();await dbPut('tracks',t)}}history.back();toast(`♥ ${S.ctx.ids.length}곡 좋아요`);updateUI();refresh();break}
  case 'edit':{const t=S.map.get(S.ctx.id);
    openSheet(`<h3>정보 수정</h3><label class="f">제목</label><input id="eT" class="in" value="${esc(t.title)}"><label class="f">아티스트</label><input id="eA" class="in" value="${esc(t.artist)}" list="artistList"><label class="f">앨범</label><input id="eL" class="in" value="${esc(t.album)}" list="albumList">
      <datalist id="artistList">${groups('artist').map(([x])=>`<option value="${esc(x)}">`).join('')}</datalist><datalist id="albumList">${groups('album').map(([x])=>`<option value="${esc(x)}">`).join('')}</datalist>
      <div class="row2"><button class="btn ghost" data-act="back">취소</button><button class="btn" data-act="editsave">저장</button></div>`);break}
  case 'editsave':{const t=S.map.get(S.ctx.id);t.title=$('#eT').value.trim()||t.title;t.artist=$('#eA').value.trim()||UNK_AR;t.album=$('#eL').value.trim()||UNK_AL;
    await dbPut('tracks',t);history.back();refresh();updateUI();$('#pT').dataset.txt='';$('#pA').dataset.txt='';updateUI();if(cur()===t)setMeta(t);toast('저장했어요');break}
  case 'delete':{const t=S.map.get(S.ctx.id);if(!confirm(`'${t.title}'을(를) 이 앱에서 삭제할까요?\n(파일 앱의 원본은 그대로 남아요)`))return;
    await dbDel('files',t.id);await dbDel('tracks',t.id);S.tracks=S.tracks.filter(x=>x.id!==t.id);S.map.delete(t.id);dropCoverURL(t.id);
    for(const p of S.pls)if(p.trackIds.includes(t.id)){p.trackIds=p.trackIds.filter(x=>x!==t.id);await dbPut('playlists',p)}
    removeFromQueue(t.id);history.back();refresh();toast('삭제했어요');break}
  case 'plremove':case 'plmove-up':case 'plmove-down':{const p=S.pls.find(x=>x.id===S.ctx.pl);if(!p)return;const i=p.trackIds.indexOf(S.ctx.id);
    if(a==='plremove')p.trackIds.splice(i,1);else{const j=i+(a==='plmove-up'?-1:1);if(j<0||j>=p.trackIds.length){history.back();return}[p.trackIds[i],p.trackIds[j]]=[p.trackIds[j],p.trackIds[i]]}
    await dbPut('playlists',p);history.back();refresh();break}
  case 'plmenu':openSheet(`<h3>플레이리스트</h3><button class="item" data-act="plrename">${I.edit}이름 바꾸기</button><button class="item" data-act="pladdall">${I.addlist}모든 노래 담기</button><button class="item danger" data-act="pldelete">${I.trash}플레이리스트 삭제</button>`);break;
  case 'plrename':{const p=S.pls.find(x=>x.id===view().key);const n=await ask('새 이름',p.name);if(!n)return;p.name=n;await dbPut('playlists',p);refresh();break}
  case 'pladdall':{const p=S.pls.find(x=>x.id===view().key);history.back();await addTo(p,S.tracks.slice().sort((a,b)=>b.addedAt-a.addedAt).map(t=>t.id));break}
  case 'pldelete':{const p=S.pls.find(x=>x.id===view().key);if(!confirm(`'${p.name}' 플레이리스트를 삭제할까요?\n(노래는 지워지지 않아요)`))return;
    await dbDel('playlists',p.id);S.pls=S.pls.filter(x=>x.id!==p.id);history.go(-2);break}
  case 'link':linkSheet();break;
  case 'linkrecv':startReceive();break;
  case 'linksend':linkReset();LINK.role='send';LINK.state='entry';linkUpdate(true);setTimeout(()=>{const i=$('#linkCode');i&&i.focus()},250);break;
  case 'linkgo':startSend((($('#linkCode')||{}).value||'').replace(/\D/g,''));break;
  case 'linkoff':linkReset();break;
  case 'sendpick':$('#sendFile').click();break;
  case 'sendlib':queueLibrary();break;
  case 'theme':applyTheme(d.th);refresh();break;
  case 'resetstats':{if(!confirm('모든 곡의 재생 횟수와 최근 들은 기록을 지울까요?'))return;
    for(const t of S.tracks)if(t.plays||t.lastPlayed){t.plays=0;t.lastPlayed=0;await dbPut('tracks',t)}refresh();toast('초기화했어요');break}
  }}

/* ================= 시작 ================= */
(async()=>{
  try{db=await openDB();S.tracks=await dbAll('tracks');S.pls=await dbAll('playlists')}
  catch(e){$('#main').innerHTML='<div class="empty">이 브라우저에서는 저장소를 열 수 없어요.<br>(사파리 개인정보 보호 모드라면 일반 모드로 열어 주세요)</div>';return}
  S.tracks.forEach(t=>S.map.set(t.id,t));
  render();restore();updateUI();tick();
  if('serviceWorker'in navigator&&location.protocol.startsWith('http')){
    navigator.serviceWorker.register('sw.js').then(r=>r.update&&r.update()).catch(()=>{});
    let had=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!had){had=true;return}
      if(audio.paused)location.reload();else toast('새 버전이 준비됐어요 · 앱을 다시 열면 적용돼요',4000)})}
})();
